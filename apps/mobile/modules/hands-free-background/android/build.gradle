apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.handsfreebackground'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace "expo.modules.handsfreebackground"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // NotificationCompat, ServiceCompat (foreground service with a type), ContextCompat.
  implementation 'androidx.core:core-ktx:1.13.1'
}

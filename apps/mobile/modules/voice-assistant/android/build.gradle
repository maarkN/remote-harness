apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.voiceassistant'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace "expo.modules.voiceassistant"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // ShortcutManagerCompat (dynamic launcher shortcuts).
  implementation 'androidx.core:core-ktx:1.13.1'
}

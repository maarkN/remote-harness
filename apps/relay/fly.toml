# br.relay.remoteharness.app on Fly.io in São Paulo. `make deploy-relay-br` deploys it; the first
# time, `fly apps create remote-harness-relay-br` and `fly certs add br.relay.remoteharness.app`
# (see CONTRIBUTING.md).
app = "remote-harness-relay-br"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_ADDR = ":8080"
  RELAY_CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  # The relay holds long-lived connections: never stop the machine for being idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
